name: V2 AI User Combos

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD override."
        required: false
        type: string

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai-user-combos:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 45
      run_command: |
        ARGS=(--mode combos --target-mode fixture-db --snapshot-source db --source-workflow ai-user-combos.yml --dry-run)
        if [ -n "${{ inputs.date }}" ]; then
          ARGS+=(--date "${{ inputs.date }}")
        fi
        python scripts/forward_v2/build_ai_bet_exports.py "${ARGS[@]}"
