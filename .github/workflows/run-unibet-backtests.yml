name: V2 Legacy EV Parity Replay

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD override."
        required: false
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unibet-backtests:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 60
      checkout_legacy_repo: false
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        ARGS=(--mode fixture-db --snapshot-mode backtest --source-workflow run-unibet-backtests.yml --max-days-ahead 7 --dry-run)
        if [ -n "${{ inputs.date }}" ]; then
          ARGS+=(--date "${{ inputs.date }}")
        fi
        python scripts/forward_v2/build_model_snapshots.py "${ARGS[@]}"
