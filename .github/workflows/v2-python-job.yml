name: V2 Python Job Runner

on:
  workflow_call:
    inputs:
      run_command:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 60
      python_version:
        required: false
        type: string
        default: "3.13"
      checkout_legacy_repo:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ullebets_v2
      ULLEBETS_OLD_REPO_ROOT: ${{ github.workspace }}/.deps/original-backend
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
      RAPIDAPI_SPORTAPI7_BASE_URL: ${{ vars.RAPIDAPI_SPORTAPI7_BASE_URL }}
      RAPIDAPI_SOFASCORE_BASE_URL: ${{ vars.RAPIDAPI_SOFASCORE_BASE_URL }}
      RAPIDAPI_SPORT_API_REAL_TIME_BASE_URL: ${{ vars.RAPIDAPI_SPORT_API_REAL_TIME_BASE_URL }}
      RAPIDAPI_SOFASCORE_SPORT_API_BASE_URL: ${{ vars.RAPIDAPI_SOFASCORE_SPORT_API_BASE_URL }}
      RAPIDAPI_SOFASPORT_BASE_URL: ${{ vars.RAPIDAPI_SOFASPORT_BASE_URL }}
      SOFASCORE_PUBLIC_API_BASE_URL: ${{ vars.SOFASCORE_PUBLIC_API_BASE_URL }}
      OPTA_RANKINGS_URL: ${{ vars.OPTA_RANKINGS_URL }}
      DEFAULT_LEAGUE_RANKING_URL: ${{ vars.DEFAULT_LEAGUE_RANKING_URL }}
      ULLEBETS_V2_FORCE_DRY_RUN: ${{ vars.ULLEBETS_V2_FORCE_DRY_RUN }}
      ULLEBETS_V2_DRY_RUN: ${{ inputs.dry_run }}
      ULLEBETS_V2_RUN_COMMAND: ${{ inputs.run_command }}
    steps:
      - name: Check out V2 repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check out original backend reference repo
        if: ${{ inputs.checkout_legacy_repo }}
        uses: actions/checkout@v4
        with:
          repository: ulle73/ullebets-vecel
          path: .deps/original-backend

      - name: Set up Node.js for legacy oracle bridge
        if: ${{ inputs.checkout_legacy_repo }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .deps/original-backend/package-lock.json

      - name: Install legacy backend dependencies
        if: ${{ inputs.checkout_legacy_repo }}
        working-directory: .deps/original-backend
        run: npm ci

      - name: Run V2 command
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ULLEBETS_V2_FORCE_DRY_RUN:-0}" = "1" ]; then
            ULLEBETS_V2_DRY_RUN="true"
          fi
          COMMAND=$(python -c 'import os; from ullebets_v2.automation import render_workflow_command; text = os.environ["ULLEBETS_V2_RUN_COMMAND"]; dry_run = os.environ.get("ULLEBETS_V2_DRY_RUN", "").lower() == "true"; print(render_workflow_command(text, dry_run=dry_run), end="")')
          if [ "${ULLEBETS_V2_DRY_RUN:-false}" = "true" ]; then
            echo "Workflow runner mode: dry-run"
          else
            echo "Workflow runner mode: write"
          fi
          bash -lc "$COMMAND"
