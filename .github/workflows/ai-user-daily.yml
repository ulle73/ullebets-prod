name: V2 AI User Daily

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "Datum (YYYY-MM-DD), kommaseparerade eller mellanslag. Tomt = idag + 4 dagar fram."
        required: false
        default: ""
        type: string

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ai-user-daily:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 45
      run_command: |
        ARGS=(--mode user-daily --target-mode fixture-db --snapshot-source db --source-workflow ai-user-daily.yml --dry-run)
        RAW_DATES="${{ inputs.dates }}"
        if [ -n "$RAW_DATES" ]; then
          while IFS= read -r TARGET_DATE; do
            if [ -n "$TARGET_DATE" ]; then
              ARGS+=(--date "$TARGET_DATE")
            fi
          done < <(printf '%s\n' "$RAW_DATES" | tr ', ' '\n' | sed '/^$/d')
        else
          ARGS+=(--max-days-ahead 5)
        fi
        python scripts/forward_v2/build_ai_bet_exports.py "${ARGS[@]}"
