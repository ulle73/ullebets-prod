name: Style-1 Frontend

on:
  push:
    branches:
      - style-1
      - style-1-tdd
    paths:
      - "frontend/**"
      - ".github/workflows/style-1-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            echo "generated_lock=false" >> "$GITHUB_OUTPUT"
          else
            npm install
            echo "generated_lock=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist generated dependency lock
        if: ${{ steps.install.outputs.generated_lock == 'true' && github.ref_name == 'style-1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): lock npm dependencies"
          git push origin HEAD:style-1
        working-directory: .

      - name: Verify implemented frontend
        run: |
          if [ -f src/main.tsx ]; then
            npm run typecheck
            npm run lint
            npm run test -- --run
            npm run build
          else
            echo "Tooling bootstrap only; feature verification starts when src/main.tsx exists."
          fi
