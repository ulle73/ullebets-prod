name: V2 Run Unibet Odds Checkpoints

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional single match date (YYYY-MM-DD)"
        required: false
        type: string
      days_ahead:
        description: "How many days ahead to scan when date is omitted"
        required: false
        default: "7"
        type: string
      checkpoint:
        description: "Optional filter (T_MINUS_3D, T_MINUS_2D, T_MINUS_1D, T_MINUS_12H, T_MINUS_2H)"
        required: false
        type: string
      now:
        description: "Optional ISO timestamp override for manual replay"
        required: false
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unibet-odds-checkpoints:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 60
      checkout_legacy_repo: false
      dependency_profile: lean
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        CAPTURE_SUMMARY="$(mktemp)"
        ARGS=(--mode fixture-db --source-workflow run-unibet-odds-checkpoints.yml --max-days-ahead "${{ inputs.days_ahead || '7' }}" --exclude-checkpoint T_MINUS_30M --exclude-checkpoint T_MINUS_10M --dry-run)
        if [ -n "${{ inputs.date }}" ]; then
          ARGS+=(--date "${{ inputs.date }}")
        fi
        if [ -n "${{ inputs.checkpoint }}" ]; then
          ARGS+=(--checkpoint "${{ inputs.checkpoint }}")
        fi
        if [ -n "${{ inputs.now }}" ]; then
          ARGS+=(--now "${{ inputs.now }}")
        fi
        python scripts/forward_v2/capture_odds_checkpoints.py "${ARGS[@]}" | tee "$CAPTURE_SUMMARY"
        CAPTURED_SNAPSHOTS="$(python - "$CAPTURE_SUMMARY" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            summary = json.load(handle)
        print(int(summary.get("market_snapshot_upserts") or 0))
        PY
        )"
        mapfile -t CAPTURED_MATCH_KEYS < <(python - "$CAPTURE_SUMMARY" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            summary = json.load(handle)
        seen = set()
        for row in summary.get("due_targets") or []:
            match_key = str(row.get("match_key") or "")
            if match_key and match_key not in seen:
                seen.add(match_key)
                print(match_key)
        PY
        )
        SCOPED_MATCH_ARGS=()
        for MATCH_KEY in "${CAPTURED_MATCH_KEYS[@]}"; do
          SCOPED_MATCH_ARGS+=(--match-key "$MATCH_KEY")
        done

        if [ "${ULLEBETS_V2_DRY_RUN:-false}" = "true" ]; then
          echo "Skipping all-model scoring after dry-run capture."
        elif [ "$CAPTURED_SNAPSHOTS" -gt 0 ]; then
          if [ "${#SCOPED_MATCH_ARGS[@]}" -eq 0 ]; then
            echo "Capture wrote snapshots but exposed no match keys; refusing unscoped scoring." >&2
            exit 1
          fi
          python -m pip install -e .
          python scripts/forward_v2/score_registered_shadow_models.py \
            --repo-root . \
            --registry models/ev/shadow_formula_registry_v1.json \
            "${SCOPED_MATCH_ARGS[@]}" \
            --dry-run
          python scripts/forward_v2/materialize_formula_journal.py \
            --repo-root . \
            --registry models/ev/shadow_formula_registry_v1.json \
            "${SCOPED_MATCH_ARGS[@]}" \
            --dry-run
        else
          echo "Skipping all-model scoring: checkpoint capture wrote no new snapshots."
        fi
