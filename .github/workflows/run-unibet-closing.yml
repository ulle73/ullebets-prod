name: V2 Run Unibet Closing Odds

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional single match date (YYYY-MM-DD)."
        required: false
        type: string
      now:
        description: "Optional ISO timestamp override for manual replay."
        required: false
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-closing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unibet-closing:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 45
      checkout_legacy_repo: false
      dependency_profile: lean
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        CAPTURE_SUMMARY="$(mktemp)"
        ARGS=(--mode fixture-db --refresh-derived --dry-run)
        if [ -n "${{ inputs.date }}" ]; then
          ARGS+=(--date "${{ inputs.date }}")
        fi
        if [ -n "${{ inputs.now }}" ]; then
          ARGS+=(--now "${{ inputs.now }}")
        fi
        python scripts/forward_v2/capture_closing_snapshots.py --source-workflow run-unibet-closing.yml "${ARGS[@]}" | tee "$CAPTURE_SUMMARY"
        CAPTURED_SNAPSHOTS="$(python - "$CAPTURE_SUMMARY" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            summary = json.load(handle)
        print(int(summary.get("market_snapshots") or 0))
        PY
        )"

        if [ "${ULLEBETS_V2_DRY_RUN:-false}" = "true" ]; then
          echo "Skipping V6 scoring after dry-run capture."
        elif [ "$CAPTURED_SNAPSHOTS" -gt 0 ]; then
          python -m pip install -e .
          python scripts/forward_v2/score_ev_shadow_model.py \
            --repo-root . \
            --artifact models/ev/ev_scope_interaction_recency45_asof_capped_v6_shadow/ev_scope_interaction_recency45_asof_capped_v6_shadow.joblib \
            --manifest models/ev/ev_scope_interaction_recency45_asof_capped_v6_shadow/model_manifest.json \
            --score-only \
            --selection-policy-registry models/ev/forward_policy_registry_v1.json \
            --selection-policy-id v6_corners_away_total_forward_v1 \
            --dry-run
        else
          echo "Skipping V6 scoring: closing capture wrote no new snapshots."
        fi
