name: V2 Durable Unibet Closing Watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      lookahead_hours:
        description: "Hours ahead covered by the runner-owned watch session."
        required: false
        default: "4"
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-closing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unibet-closing-watch:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 330
      checkout_legacy_repo: false
      dependency_profile: full
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        python scripts/forward_v2/watch_closing_window.py \
          --source-workflow run-unibet-closing.yml \
          --lookahead-hours "${{ inputs.lookahead_hours || '4' }}" \
          --max-session-minutes 320 \
          --poll-seconds 60 \
          --lease-seconds 180 \
          --owner-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
          --dry-run
