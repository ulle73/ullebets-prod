name: V2 Run Unibet Closing Odds

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional single match date (YYYY-MM-DD)."
        required: false
        type: string
      now:
        description: "Optional ISO timestamp override for manual replay."
        required: false
        type: string

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unibet-closing:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 45
      checkout_legacy_repo: false
      run_command: |
        ARGS=(--mode fixture-db --dry-run)
        if [ -n "${{ inputs.date }}" ]; then
          ARGS+=(--date "${{ inputs.date }}")
        fi
        if [ -n "${{ inputs.now }}" ]; then
          ARGS+=(--now "${{ inputs.now }}")
        fi
        python scripts/forward_v2/capture_closing_snapshots.py "${ARGS[@]}"
