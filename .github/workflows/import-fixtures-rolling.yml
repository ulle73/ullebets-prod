name: V2 Import fixtures (rolling D0-D7)

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (YYYY-MM-DD). Defaults to today in Stockholm."
        required: false
        type: string
      end_date:
        description: "Optional end date (YYYY-MM-DD). Defaults to today+7 in Stockholm."
        required: false
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-script:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 60
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        START="${{ inputs.start_date }}"
        if [ -z "$START" ]; then
          START=$(TZ=Europe/Stockholm date +%F)
        fi
        END="${{ inputs.end_date }}"
        if [ -z "$END" ]; then
          END=$(TZ=Europe/Stockholm date -d '+7 days' +%F)
        fi
        python scripts/forward_v2/ingest_fixtures_window.py \
          --mode live \
          --start-date "$START" \
          --end-date "$END" \
          --source-workflow import-fixtures-rolling.yml \
          --dry-run
