name: V2 Enrich matchups results

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date or range to enrich (YYYY-MM-DD or YYYY-MM-DD-YYYY-MM-DD)."
        required: false
        type: string
      dry_run:
        description: "Run without writes (smoke test)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-matchup-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 90
      dry_run: ${{ inputs.dry_run || false }}
      run_command: |
        DATE="${{ inputs.target_date }}"
        if [ -z "$DATE" ]; then
          START_DATE=$(date -u -d '45 days ago' +'%Y-%m-%d')
          END_DATE=$(date -u -d 'yesterday' +'%Y-%m-%d')
          ENRICH_START_DATE=$(date -u -d 'yesterday' +'%Y-%m-%d')
        elif [ "${#DATE}" -eq 10 ]; then
          START_DATE="$DATE"
          END_DATE="$DATE"
          ENRICH_START_DATE="$DATE"
        else
          START_DATE="${DATE:0:10}"
          END_DATE="${DATE:11:10}"
          ENRICH_START_DATE="$START_DATE"
        fi
        python scripts/forward_v2/ingest_match_enrichment.py --mode live --fixture-source db --start-date "$ENRICH_START_DATE" --end-date "$END_DATE" --include-unresolved-matchup-observations --source-workflow enrich-matchups-results.yml --dry-run
        python scripts/forward_v2/repair_matchup_history.py --start-date "$START_DATE" --end-date "$END_DATE" --max-rebuild-dates 2 --source-workflow enrich-matchups-results.yml --dry-run
        python scripts/forward_v2/refresh_matchup_results.py --date-from "$START_DATE" --date-to "$END_DATE" --dry-run
