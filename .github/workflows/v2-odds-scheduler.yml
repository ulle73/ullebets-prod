name: V2 Match-Aware Odds Scheduler

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Days ahead to inspect regular checkpoints."
        required: false
        default: "7"
        type: string
      dry_run:
        description: "Run without writes."
        required: false
        default: false
        type: boolean

concurrency:
  group: ullebets-v2-odds-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schedule-odds-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ullebets_v2
    steps:
      - name: Check out V2 repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lean scheduler dependency
        run: python -m pip install "pymongo>=4.8.0"

      - name: Capture due production checkpoints
        run: |
          CAPTURE_SUMMARY="$(mktemp)"
          ARGS=(
            --mode fixture-db
            --source-workflow run-unibet-odds-checkpoints.yml
            --max-days-ahead "${{ inputs.days_ahead || '7' }}"
            --exclude-checkpoint T_MINUS_12H
            --exclude-checkpoint T_MINUS_30M
            --exclude-checkpoint T_MINUS_10M
          )
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/forward_v2/capture_odds_checkpoints.py "${ARGS[@]}" | tee "$CAPTURE_SUMMARY"

  process-persisted-checkpoints:
    needs: schedule-odds-captures
    if: ${{ always() && inputs.dry_run != true && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ullebets_v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install -e .
      - name: Resume persisted checkpoints and verify consumers
        run: python -u scripts/forward_v2/resume_checkpoint_processing.py --repo-root .
