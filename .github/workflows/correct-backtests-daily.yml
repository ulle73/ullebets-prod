name: V2 Daily Backtest Correction

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ullebets-v2-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  correct-backtests:
    uses: ./.github/workflows/v2-python-job.yml
    secrets: inherit
    with:
      timeout_minutes: 30
      run_command: |
        python scripts/forward_v2/settle_model_snapshots.py \
          --source-workflow correct-backtests-daily.yml \
          --dry-run
